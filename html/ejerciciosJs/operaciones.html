<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones</title>
</head>
<body>
    <script>
        const x = Number(prompt("X:")) //Number convierte a numero el dato
        const y = Number(prompt("Y:"))
        
        const resultado = 'La suma de x: ${x} y Y:${y} es: $(x + y)'
        console.log(resultado)
        alert(resultado)
    </script>
</body>
</html>
